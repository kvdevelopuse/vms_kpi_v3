.tab:disabled:hover{background:#f0f2f5;color:#8b97a6}

.content{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#f3f6fa}
.dashboard-frame{position:absolute;left:0;top:0;display:block;margin:0;padding:0;border:0;background:#f3f6fa;transform-origin:top left;overflow:hidden}
.dashboard-frame[hidden]{display:none}

const overrides={"fleet":"\n/* Outer-shell screen fitting only. All graph SVG paths, colors and data remain untouched. */\nhtml,body{width:100%;height:100%;overflow:hidden!important;}\nbody:not(.in-drill)>.shell{max-width:none!important;width:100%!important;height:100dvh!important;min-height:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;}\nbody:not(.in-drill)>.shell>.topbar{flex:0 0 auto!important;}\nbody:not(.in-drill)>.shell>.kpis{flex:0 0 auto!important;}\nbody:not(.in-drill)>.shell>.dashboard{flex:1 1 auto!important;min-height:0!important;display:grid!important;grid-template-rows:minmax(0,.83fr) minmax(0,1.01fr) minmax(0,1.29fr)!important;}\nbody:not(.in-drill)>.shell>.dashboard>.dashboard-row{height:100%!important;min-height:0!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;}\nbody:not(.in-drill)>.shell>.footer{flex:0 0 auto!important;}\nbody:not(.in-drill) .dashboard-row>.card{height:100%;min-height:0;}\nbody.in-drill>.shell{max-width:none!important;width:100%!important;height:100dvh!important;min-height:0!important;}\n","driver":"\n/* Screen fitting only; preserve all original charts and their grid composition. */\nhtml,body{width:100%;}\nbody.landing-mode{width:100%!important;height:100dvh!important;overflow:hidden!important;}\nbody.landing-mode>.page{max-width:none!important;width:100%!important;height:100dvh!important;min-height:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;}\nbody.landing-mode>.page>.dashboardHeader{flex:0 0 auto!important;}\nbody.landing-mode>.page>.filter-error{flex:0 0 auto!important;}\nbody.landing-mode>.page>.overview{flex:1 1 auto!important;min-height:0!important;display:grid!important;grid-template-rows:100px minmax(0,1.12fr) minmax(0,.88fr)!important;gap:12px!important;}\nbody.landing-mode .overview>.top-panels,body.landing-mode .overview>.bottom-panels{height:100%!important;min-height:0!important;margin:0!important;}\nbody.landing-mode .overview>.top-panels{grid-template-columns:repeat(3,minmax(0,1fr))!important;}\nbody.landing-mode .overview>.bottom-panels{grid-template-columns:repeat(3,minmax(0,1fr))!important;}\nbody.landing-mode .overview>.top-panels>.panel,body.landing-mode .overview>.bottom-panels>.panel{height:100%!important;min-height:0!important;max-height:100%!important;}\n/* Full width for drill-down, too; its table may scroll internally. */\nbody:not(.landing-mode)>.page{max-width:none!important;width:100%!important;}\n"};
const frames={fleet:document.getElementById('fleet-panel'),driver:document.getElementById('driver-panel')};
const loaded={fleet:false,driver:false};
const tabs=[...document.querySelectorAll('[data-panel]')];
const content=document.getElementById('content');
let active='fleet';
const drillObservers={fleet:null,driver:null};
// Monitor the dashboard's own detail-view class; no changes to the embedded dashboard.
function isDrilled(){
 const doc=frames[active].contentDocument;
 if(!doc || !doc.body)return false;
 return active==='fleet'?doc.body.classList.contains('in-drill'):
   !doc.body.classList.contains('landing-mode');
}
function refreshDashboardTabs(){
 const locked=isDrilled();
 for(const tab of tabs){
   tab.disabled=locked;
   tab.setAttribute('aria-disabled',String(locked));
   tab.title=locked?'Return to the dashboard landing screen to switch tabs':'';
 }
}
function decode64(b64){const data=atob(b64);return new TextDecoder().decode(Uint8Array.from(data,c=>c.charCodeAt(0)));}
function ensureLoaded(name){
 if(loaded[name])return;
 frames[name].addEventListener('load',()=>{
   const doc=frames[name].contentDocument;
   if(!doc || doc.getElementById('screen-fit-overrides'))return;
   const style=doc.createElement('style');style.id='screen-fit-overrides';style.textContent=overrides[name];doc.head.appendChild(style);
   // Fleet: body.in-drill. Driver: absence of body.landing-mode.
   if(drillObservers[name])drillObservers[name].disconnect();
   drillObservers[name]=new MutationObserver(refreshDashboardTabs);
   drillObservers[name].observe(doc.body,{attributes:true,attributeFilter:['class']});
   refreshDashboardTabs();
   fit();
 });
 frames[name].srcdoc=decode64(source[name]);
 loaded[name]=true;
}
function fit(){
 const rect=content.getBoundingClientRect();if(!rect.width||!rect.height)return;
 // Uniform scale: never distort the graphs, circles or text.
 // Width and height of the virtual viewport each fill the available screen.
 const scale=Math.min(rect.width/1900,rect.height/950);
 const virtualWidth=rect.width/scale;
 const virtualHeight=rect.height/scale;
 for(const [name,frame] of Object.entries(frames)){
   if(!loaded[name])continue;
   frame.style.width=virtualWidth+'px';
   frame.style.height=virtualHeight+'px';
   frame.style.transform='scale('+scale+')';
 }
}
function select(name,focus=false){
 // Prevent tab switching from mouse, keyboard, or programmatic calls during Explore.
 if(!frames[name]||(name!==active&&isDrilled()))return;
 active=name;
 ensureLoaded(name);
 for(const tab of tabs){const selected=tab.dataset.panel===name;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;if(selected&&focus)tab.focus();}
 for(const [key,frame] of Object.entries(frames))frame.hidden=key!==name;
 refreshDashboardTabs();
 fit();
}
tabs.forEach((tab,index)=>{
 tab.addEventListener('click',()=>select(tab.dataset.panel));
 tab.addEventListener('keydown',e=>{const target=e.key==='ArrowRight'?(index+1)%tabs.length:e.key==='ArrowLeft'?(index+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;if(target===null)return;e.preventDefault();select(tabs[target].dataset.panel,true);});
});
window.addEventListener('resize',fit);
select('fleet');
</script>
