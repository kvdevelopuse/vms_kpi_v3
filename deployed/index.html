const frames={fleet:document.getElementById('fleet-panel'),driver:document.getElementById('driver-panel')};
const tabs=[...document.querySelectorAll('[data-panel]')];
const content=document.getElementById('content');
const loaded={fleet:false,driver:false};
let active='fleet';
function load(name){
 if(loaded[name])return;
 const ascii=atob(embedded[name]);
 const bytes=Uint8Array.from(ascii,c=>c.charCodeAt(0));
 frames[name].srcdoc=new TextDecoder('utf-8').decode(bytes);
 loaded[name]=true;
}
function fit(){
 const bounds=content.getBoundingClientRect();
 if(!bounds.width||!bounds.height)return;
 // One UNIFORM scale on both axes: original graph proportions never get distorted.
 // A flexible virtual canvas fills both axes, avoiding letterboxing and scrollbars.
 // The minimum virtual height preserves the dashboards' original content density.
 const virtualWidth=Math.max(1760,Math.min(1920,bounds.width),bounds.width*940/bounds.height);
 const scale=bounds.width/virtualWidth;
 const virtualHeight=bounds.height/scale;
 const frame=frames[active];
 frame.style.width=virtualWidth+'px';
 frame.style.height=virtualHeight+'px';
 frame.style.transform='scale('+scale+')';
}
function show(name,focus=false){
 if(!frames[name])return;
 active=name;load(name);
 for(const tab of tabs){
  const current=tab.dataset.panel===name;
  tab.setAttribute('aria-selected',String(current));
  tab.tabIndex=current?0:-1;
  if(current&&focus)tab.focus();
 }
 for(const [key,frame] of Object.entries(frames))frame.hidden=key!==name;
 fit();
}
tabs.forEach((tab,index)=>{
 tab.addEventListener('click',()=>show(tab.dataset.panel));
 tab.addEventListener('keydown',event=>{
  const next=event.key==='ArrowRight'?(index+1)%tabs.length:event.key==='ArrowLeft'?(index+tabs.length-1)%tabs.length:event.key==='Home'?0:event.key==='End'?tabs.length-1:null;
  if(next===null)return;
  event.preventDefault();show(tabs[next].dataset.panel,true);
 });
});
window.addEventListener('resize',fit);
show('fleet');
